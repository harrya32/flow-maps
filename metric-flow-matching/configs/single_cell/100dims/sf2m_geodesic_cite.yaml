# Paper-style SF2M Geodesic Sinkhorn on CITE-seq PCA100 marginals.
data_type: "scrna"
data_name: "cite"
accelerator: "gpu"
dim: 100
t_exclude: [1, 2]
whiten: false
cite_multi_time_mode: "equal_time"

hidden_dims_flow: [1024, 1024, 1024]
activation_flow: "selu"
flow_optimizer: "adamw"
flow_lr: 0.001
flow_weight_decay: 0.00001
batch_size: 128
patience: 10

mfm: false
sf2m: true
sf2m_sigma: 0.2
sf2m_ot_method: "sinkhorn"
sf2m_ot_cost: "geodesic"
sf2m_geodesic_knn: 5
sf2m_geodesic_heat_time: 1.0

sf2m_geodesic_graph_max_points: 10000
sf2m_geodesic_eigenvectors: 128
sf2m_geodesic_sinkhorn_max_iter: 1000
sf2m_geodesic_sinkhorn_tol: 0.00001

sf2m_geodesic_graph_max_points: 0
sf2m_score_weight: 1.0
sf2m_time_eps: 0.001
# SF2M performs its minibatch coupling internally.
optimal_transport_method: "None"

max_steps: 10000
val_check_interval: 100
seeds: [0, 1, 2, 3, 4]

cite_multi_eval_enabled: true
cite_multi_eval_check_times: 50
cite_multi_eval_every_n_steps: 500
cite_multi_eval_source_max_points: 0
wandb_project: "self-distill-flow-maps"
