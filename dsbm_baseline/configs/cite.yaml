# Piecewise DSBM-IMF on CITE-seq PCA100, once for each omitted middle day.
data_type: "scrna"
data_name: "cite"
accelerator: "gpu"
dim: 100
t_exclude: [1, 2]
whiten: false
cite_multi_time_mode: "equal_time"

dsbm_first_coupling: "ind"
dsbm_sigma: 0.2
dsbm_num_steps: 20
dsbm_time_eps: 0.001
dsbm_learning_rate: 0.0001
dsbm_hidden_dims: [256, 256]
dsbm_activation: "silu"
dsbm_outer_iterations: 40
dsbm_inner_iterations: 250
dsbm_train_points_per_marginal: 10000
dsbm_normalize: true
dsbm_scale_sigma_by_interval: true

batch_size: 128
split_ratios: [0.9, 0.1]
dsbm_validation_points: 1024
dsbm_validation_every_forward: 1
dsbm_eval_points_per_time: 0
dsbm_eval_euler_steps: 100
dsbm_eval_batch_size: 1024

seeds: [0, 1, 2, 3, 4]
cite_multi_eval_enabled: true
cite_multi_eval_check_times: 50
cite_multi_eval_every_n_steps: 500
cite_multi_eval_source_max_points: 0
wandb_project: "self-distill-flow-maps"

